<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Withdraw - ZapCash Lite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="header">
    <h1>Withdrawal Request</h1>
  </header>

  <main class="container">
    <p class="withdraw-text">Fill in your details to request a withdrawal.</p>

    <form class="withdraw-form">
      <input type="text" placeholder="Full Name" required />
      <input type="text" placeholder="Bank or Airtime Number" required />
      <input type="number" placeholder="Amount (e.g. 200)" required />
      <textarea placeholder="Any message (optional)"></textarea>
      <button class="button">Submit Request</button>
    </form>

    <div class="action-buttons">
      <a href="dashboard.html" class="button">⬅ Back to Dashboard</a>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 ZapCash Lite. Your money, your way 💸</p>
  </footer>
</body>
</html>
